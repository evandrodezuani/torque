<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Crie a sua senha</title>
</head>
<body style="margin: 0; padding: 24px; background: #f3f4f6; font-family: Arial, sans-serif; color: #1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px;">
    <tr>
        <td style="padding: 24px;">
            <h1 style="margin: 0 0 8px; font-size: 20px;">Crie a sua senha</h1>
            <p style="margin: 0 0 16px;">
                Olá, <span th:text="${cliente.nome}">Maria</span>. Com a sua senha você acompanha as suas
                ordens de serviço e responde aos orçamentos. Para entrar, use o seu e-mail
                <strong th:text="${cliente.email}">maria@email.com</strong> e a senha que criar.
            </p>
            <p style="margin: 0 0 16px;">
                <a th:href="${urlDaSenha}" href="#" target="_blank" rel="noopener"
                   style="display: inline-block; padding: 10px 20px; border-radius: 6px; background: #15803d;
                          color: #ffffff; text-decoration: none;">Criar a minha senha</a>
            </p>
            <p style="margin: 0; font-size: 13px; color: #6b7280;">
                O link vale por 24 horas e pode ser usado uma única vez.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
